apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-dev-set
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/YOUR_ORG/argocd-applicationset-lab.git
        revision: main
        directories:
          - path: gitops/envs/dev/*
  template:
    metadata:
      name: '{{ .path.basename }}-dev'
    spec:
      project: lab
      source:
        repoURL: https://github.com/YOUR_ORG/argocd-applicationset-lab.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd-lab-dev
      syncPolicy:
        syncOptions:
          - CreateNamespace=true

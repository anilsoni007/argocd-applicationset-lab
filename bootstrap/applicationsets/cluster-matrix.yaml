apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-by-cluster
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  lab: "true"
          - git:
              repoURL: https://github.com/YOUR_ORG/argocd-applicationset-lab.git
              revision: main
              directories:
                - path: 'gitops/envs/{{ .metadata.labels.environment }}/*'
  template:
    metadata:
      name: '{{ .path.basename }}-{{ .name }}'
    spec:
      project: lab
      source:
        repoURL: https://github.com/YOUR_ORG/argocd-applicationset-lab.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: '{{ .server }}'
        namespace: 'argocd-lab-{{ .metadata.labels.environment }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab
  namespace: argocd
spec:
  description: Restricted project for the Argo CD Applications and ApplicationSets lab
  sourceRepos:
    - https://github.com/YOUR_ORG/argocd-applicationset-lab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd-lab-dev
    - server: https://kubernetes.default.svc
      namespace: argocd-lab-prod
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment

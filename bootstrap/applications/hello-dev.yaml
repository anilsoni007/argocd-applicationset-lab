apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-dev
  namespace: argocd
spec:
  project: lab
  source:
    repoURL: https://github.com/YOUR_ORG/argocd-applicationset-lab.git
    targetRevision: main
    path: gitops/envs/dev/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-lab-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
